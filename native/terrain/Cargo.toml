[package]
name = "stellar-terrain"
version = "0.1.1"
edition = "2021"
rust-version = "1.88"

[lib]
name = "stellar_terrain"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py310", "generate-import-lib"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[profile.release]
lto = "thin"
codegen-units = 1
