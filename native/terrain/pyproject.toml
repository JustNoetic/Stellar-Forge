[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "stellar-terrain"
version = "0.1.1"
requires-python = ">=3.10"
description = "Native quadtree and bounded planetary tile streaming for Stellar Forge"

[tool.maturin]
bindings = "pyo3"
module-name = "stellar_terrain"

